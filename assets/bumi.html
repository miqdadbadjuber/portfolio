            const sunDir = new THREE.Vector3(1.5,0.45,1.0).normalize();

            const earthMat = new THREE.ShaderMaterial({
                uniforms: {
                    dayTex: {
                        value: dayTex
                    },
                    nightTex: {
                        value: nightTex
                    },
                    cloudsTex: {
                        value: cloudsTex
                    },
                    sunDir: {
                        value: sunDir
                    },
                    uBoost: {
                        value: S.bright
                    }
                },
                vertexShader: `varying vec2 vUv; varying vec3 vN;
    void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal);
      gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0); }`,
                fragmentShader: `uniform sampler2D dayTex,nightTex,cloudsTex; uniform vec3 sunDir; uniform float uBoost;
    varying vec2 vUv; varying vec3 vN;
    void main(){ vec3 N=normalize(vN); float sunO=dot(N,sunDir);
      float dayMix=smoothstep(-0.25,0.5,sunO);
      vec3 dayCol=texture2D(dayTex,vUv).rgb, nightCol=texture2D(nightTex,vUv).rgb;
      float cl=smoothstep(0.30,1.0,texture2D(cloudsTex,vUv).b);
      vec3 daySurf=mix(dayCol,vec3(1.0),cl*0.9)*uBoost;
      vec3 col=mix(nightCol*1.25,daySurf,dayMix);
      col=col/(col+0.55)*1.55;
      gl_FragColor=vec4(min(col,vec3(1.0)),1.0); }`
            });
            const geo = new THREE.SphereGeometry(1,64,64);
            const tiltGroup = new THREE.Group();
            tiltGroup.rotation.z = 23.4 * Math.PI / 180;
            const earth = new THREE.Mesh(geo,earthMat);
            tiltGroup.add(earth);
            scene.add(tiltGroup);

            const cv = document.getElementById("a")
              , ctx = cv.getContext("2d", {
                alpha: false
            });
            const samp = document.createElement('canvas');
            const sctx = samp.getContext('2d', {
                willReadFrequently: true
            });
            const hint = document.getElementById("hint");
            let W, H, DPR, cell, cols, rows, adv = 0;

            function hex2rgb(h) {
                h = h.replace('#', '');
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
            }
            let PAL = [];
            function buildPal() {
                const a = hex2rgb(S.col1)
                  , b = hex2rgb(S.col2);
                PAL = [];
                for (let i = 0; i < NLEV; i++) {
                    const t = i / (NLEV - 1);
                    PAL.push('rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')');
                }
            }
            buildPal();

            function autoCell() {
                return Math.max(7, Math.round(Math.min(W, H) / 84));
            }
            function resize() {
                DPR = Math.min(2, window.devicePixelRatio || 1);
                W = innerWidth;
                H = innerHeight;
                cv.width = Math.round(W * DPR);
                cv.height = Math.round(H * DPR);
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                cell = S.cell > 0 ? S.cell : autoCell();
                cols = Math.ceil(W / cell) + 1;
                rows = Math.ceil(H / cell) + 1;
                samp.width = cols;
                samp.height = rows;
                renderer.setPixelRatio(1);
                renderer.setSize(cols * SS, rows * SS, false);
                camera.aspect = cols / rows;
                camera.updateProjectionMatrix();
                ctx.font = '700 ' + cell + 'px "Space Mono", ui-monospace, monospace';
                ctx.textBaseline = "middle";
                ctx.textAlign = "left";
                adv = ctx.measureText("0").width || cell * 0.6;
                try {
                    ctx.letterSpacing = (cell - adv) + "px";
                } catch (e) {}
            }
            addEventListener("resize", resize);
            if (document.fonts && document.fonts.ready)
                document.fonts.ready.then(resize);

            let p = 0
              , targetP = 1;
            function onScroll() {
                const max = document.documentElement.scrollHeight - innerHeight;
                targetP = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
                if (hint)
                    hint.style.opacity = targetP > 0.02 ? 0 : .65;
            }
            addEventListener("scroll", onScroll, {
                passive: true
            });
            /* Copyright Miqdad Badjuber: host page drives scroll progress via postMessage */
            addEventListener("message", function(ev) {
                var d = ev && ev.data;
                if (d && typeof d.miqdadScroll === "number")
                    targetP = Math.min(1, Math.max(0, d.miqdadScroll));
            });

            // Precomputed Level LUT (Lookup Table) for 60fps zero-overhead luminance mapping
            const LVL_LUT = new Int8Array(256);
            function buildLvlLUT() {
                for (let k = 0; k < 256; k++) {
                    const v = k / 255;
                    if (v < S.thr) {
                        LVL_LUT[k] = -1;
                        continue;
                    }
                    let t = (v - S.thr) / (1 - S.thr);
                    t = (t - PIVOT) * S.contrast + PIVOT;
                    t = t < 0 ? 0 : t > 1 ? 1 : t;
                    if (S.invert) t = 1 - t;
                    let i = Math.round(t * (NLEV - 1));
                    LVL_LUT[k] = i < 0 ? 0 : i > NLEV - 1 ? NLEV - 1 : i;
                }
            }
            buildLvlLUT();

            let lastRender = performance.now();
            function frame(now) {
                if (document.hidden) {
                    lastRender = now;
                    requestAnimationFrame(frame);
                    return;
                }
                const dt = Math.min(0.05, (now - lastRender) / 1000);
                lastRender = now;
                earth.rotation.y += S.spin * dt;
                p += (targetP - p) * 0.06;
                const e = p * p * (3 - 2 * p);
                const d = D_FAR + (D_NEAR - D_FAR) * e;
                camera.position.set(0, 0, d);
                camera.fov = FOV_FAR + (FOV_END - FOV_FAR) * e;
                camera.updateProjectionMatrix();
                camera.lookAt(0, LOOK_Y * e, 0);

                renderer.render(scene, camera);

                sctx.drawImage(glCanvas, 0, 0, cols, rows);
                let px;
                try {
                    px = sctx.getImageData(0, 0, cols, rows).data;
                } catch (err) {
                    requestAnimationFrame(frame);
                    return;
                }

                ctx.fillStyle = "#020202";
                ctx.fillRect(0, 0, W, H);
                const txt = S.text || " ";
                const tl = txt.length;

                for (let row = 0; row < rows; row++) {
                    const py = row * cell + cell * 0.5;
                    const rowOffset = row * cols;
                    let runStr = "";
                    let runStart = 0;
                    let runL = -999;

                    for (let col = 0; col < cols; col++) {
                        const pIdx = (rowOffset + col) * 4;
                        const lum = (87 * px[pIdx] + 118 * px[pIdx + 1] + 51 * px[pIdx + 2]) >> 8;
                        const g = LVL_LUT[lum];

                        if (g < 0) {
                            if (runStr) {
                                ctx.fillStyle = PAL[runL];
                                ctx.fillText(runStr, runStart * cell + (cell - adv) / 2, py);
                                runStr = "";
                            }
                            runL = -999;
                            continue;
                        }
                        if (g !== runL) {
                            if (runStr) {
                                ctx.fillStyle = PAL[runL];
                                ctx.fillText(runStr, runStart * cell + (cell - adv) / 2, py);
                                runStr = "";
                            }
                            runL = g;
                            runStart = col;
                        }
                        runStr += txt[(rowOffset + col) % tl];
                    }
                    if (runStr) {
                        ctx.fillStyle = PAL[runL];
                        ctx.fillText(runStr, runStart * cell + (cell - adv) / 2, py);
                    }
                }
                requestAnimationFrame(frame);
            }
            resize();
            onScroll();
            requestAnimationFrame(frame);

            window.__earth = earth;
            Object.defineProperty(window, '__p', {
                get: () => +p.toFixed(3)
            });
            window.__S = S;
        </script>
